<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plato - New Architecture</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,600,0,0" rel="stylesheet">
</head>
<body>
    <div class="header">

        <div class="navbar">
            <div class="logo">
                <span class="material-symbols-outlined" id="logoIcon"><span class="glyph">looks</span></span>
                <span class="logo-text">PLATO</span>
            </div>
            <button id="settingsBtn" class="btn btn-secondary" title="Settings">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </div>

        <div class="search-box">
            <div class="dropdown-search">
                <button id="searchInBtn" class="btn-primary">
                    <span class="material-symbols-outlined">subscriptions</span> All Channels
                    <span class="material-symbols-outlined">arrow_drop_down</span>
                </button>
                <div id="searchInPanel" class="dropdown-panel hidden"></div>
            </div>
            <input type="text" id="searchInput" placeholder="Enter a title, director, actor, or genre..." autocomplete="off">
        </div>

        <div class="top-controls">
            <button id="toggleTermsBtn" class="btn btn-secondary active">
                <span class="material-symbols-outlined">filter_list</span> Key words
            </button>

            <div class="dropdown-related">
                <button id="filterRelatedBtn" class="btn btn-primary dropdown-btn">
                    <span class="related-main">
                        <span class="material-symbols-outlined related-icon">verified</span>
                        <span class="related-label">Featured</span>
                    </span>
                    <span class="related-arrow">
                        <span class="material-symbols-outlined">arrow_drop_down</span>
                    </span>
                </button>
                <div id="relatedPanel" class="dropdown-panel hidden"></div>
            </div>

            <button id="filterWatchingBtn" class="btn btn-secondary">
                <span class="material-symbols-outlined">visibility</span> Watching
            </button>

            <button id="filterFavoriteBtn" class="btn btn-secondary">
                <span class="material-symbols-outlined">star</span> Favorites
            </button>

            <div class="dropdown-collection">
                <button id="filterCollectionBtn" class="btn btn-secondary dropdown-btn">
                    <span class="collections-main">
                        <span class="material-symbols-outlined collections-icon">join_inner</span>
                        <span class="collections-label">Collection</span>
                    </span>
                    <span class="collections-arrow">
                        <span class="material-symbols-outlined">arrow_drop_down</span>
                    </span>
                </button>
                <div id="collectionsPanel" class="dropdown-panel hidden"></div>
            </div>

            <button id="filterTrashBtn" class="btn btn-secondary">
                <span class="material-symbols-outlined">delete</span> Trash
            </button>

            <div class="dropdown-sort">
                <button id="sortBtn" class="btn btn-primary dropdown-btn">
                    <span id="sortIcon" class="material-symbols-outlined">calendar_today</span>
                    <span id="sortLabel">Date</span>
                    <span class="material-symbols-outlined">arrow_drop_down</span>
                </button>
                <div id="sortPanel" class="dropdown-panel hidden">
                    <div class="dropdown-header">Sort by</div>
                    <label data-value="date"><span class="material-symbols-outlined">calendar_today</span> <span class="sort-label-text">Date</span></label>
                    <label data-value="published"><span class="material-symbols-outlined">event</span> <span class="sort-label-text">Premiere</span></label>
                    <label data-value="title"><span class="material-symbols-outlined">sort_by_alpha</span> <span class="sort-label-text">Title</span></label>
                    <label data-value="channel"><span class="material-symbols-outlined">subscriptions</span> <span class="sort-label-text">Channel</span></label>
                    <label data-value="mostLiked"><span class="material-symbols-outlined">thumb_up</span> <span class="sort-label-text">Most liked</span></label>
                    <label data-value="mostCommented"><span class="material-symbols-outlined">forum</span> <span class="sort-label-text">Most commented</span></label>
                </div>
            </div>
        </div>

        <div id="key_wordsBar" class="key_words-bar"></div>

        <div id="directorsBar" class="key_words-bar"></div>
        <div id="actorsBar" class="key_words-bar"></div>
        <div id="genresBar" class="key_words-bar"></div>
        <div id="yearsBar" class="key_words-bar"></div>
        <div id="countriesBar" class="key_words-bar"></div>
        <div id="languagesBar" class="key_words-bar"></div>

    </div>

    <!-- Sidebar (settings panel) - solo para ajustes generales en el futuro -->
    <div id="settingsSidebar" class="sidebar hidden">
        <div class="sidebar-header">
            <h3>Settings</h3>
            <button id="closeSidebarBtn" class="btn btn-secondary">✕</button>
        </div>
        <div class="sidebar-section"></div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
    
    <div class="container">
        <div class="history-header" id="historyHeader">
            <h2 id="historyTitle">Exact results (0)</h2>
        </div>
        <div id="movieModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div id="modalBody"></div>
                <button id="watchMovieBtn" class="btn btn-primary modal-watch-btn">Watch on YouTube</button>
            </div>
        </div>
        <div id="resultsGrid" class="results"></div>
    </div>
    

    <script type="module" src="js/app.js"></script>
</body>
</html>
